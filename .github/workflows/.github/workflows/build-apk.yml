name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GasLineSearch_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o GasLineSearch_Android_Project.zip
          cd GasLineSearch

      - name: Build APK
        working-directory: GasLineSearch
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasLineSearch-APK
          path: GasLineSearch/app/build/outputs/apk/debug/*.apk
